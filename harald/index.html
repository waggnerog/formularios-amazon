<script id="sistematica-data" type="application/json">{"meta":{"title":"Sistemática Visual — HARALD","reviewDate":"02/10/2026","basedOn":"Cópia de SISTEMARICA GERAL.xlsx","scenarios":{"C1":"START 1","C2":"START 1 + START 2"},"notes":"Setores, lojas e roteiros conforme a planilha original. Cenários alternativos; não somar."},"stores":[],"teams":[]}</script>

<script>
(()=>{'use strict';
const DATA=JSON.parse(document.getElementById('sistematica-data').textContent);
const ICON=n=>`<svg class="icon"><use href="#i-${n}"/></svg>`;
const escapeHtml=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const text=x=>escapeHtml(String(x??'').trim()||'Não informado');
const fmt=(n,d=0)=>Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const PRI={'Máxima':0,'Média':1,'Baixa':2};
const WEEKDAYS=['SEG','TER','QUA','QUI','SEX','SAB'];
const WEEKLABEL=['Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const STORE_KEY='harald.sistematica.visual.v1';
let saved={promoters:{},notes:{},sectorNotes:{},promoterNotes:{},favorites:{},author:'Wagner'};
try{let x=JSON.parse(localStorage.getItem(STORE_KEY)||'null'); if(x&&typeof x==='object'){saved={...saved,...x,promoters:x.promoters||{},notes:x.notes||{},sectorNotes:x.sectorNotes||{},promoterNotes:x.promoterNotes||{},favorites:x.favorites||{}}}}catch(err){}
function persist(){if(window.haraldCloud?.role()==='viewer'){toast('Você possui acesso somente para consulta.');return false}try{localStorage.setItem(STORE_KEY,JSON.stringify(saved));if(window.haraldCloud?.isReady())window.haraldCloud.scheduleSync();return true}catch(err){return false}}
let state={scenario:'C2',contract:'HORISTA',contact:'ALL',page:'overview',search:'',uf:'',priority:'',model:'',brand:'',sector:'',onlyFavorites:false,pageNo:1,limit:24,routeSector:'GH2-BA-001',week:1,day:'SEG',focus:false,drawer:null};
let toastTimer;
const toast=(msg)=>{const node=document.getElementById('toast');node.textContent=msg;node.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>node.classList.remove('show'),3400)};
const shops=()=>DATA.stores.filter(x=>x.sc===state.scenario);
const teams=()=>DATA.teams.filter(x=>x.sc===state.scenario);
const allowedModel=model=>model==='HORISTA';
const scopedStores=()=>shops().filter(s=>allowedModel(s.model));
const scopedTeams=()=>teams().filter(t=>allowedModel(t.model));
function setContract(){state.contract='HORISTA';}
const promoter=sector=>saved.promoters[sector]||{};
const initial=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]?.toUpperCase()).join('');
function setPage(page){state.page=page;state.pageNo=1;document.getElementById('sidebar').classList.remove('mobileOpen');document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===page));render();window.scrollTo({top:0,behavior:'auto'})}
function setScenario(){state.scenario='C2';}
function toggleFocus(){state.focus=!state.focus;document.body.classList.toggle('focus-mode',state.focus);document.getElementById('focusSide').innerHTML=ICON('focus')+(state.focus?' Desativar Modo Foco':' Ativar Modo Foco');toast(state.focus?'Modo Foco ativado':'Modo Foco desativado')}
function badgePri(s){return `<span class="pill ${s==='Máxima'?'pmax':s==='Média'?'pmedia':'pbaixa'}">${escapeHtml(s||'—')}</span>`}
function badgeModel(s){return `<span class="pill ${s==='FULLTIME'?'pft':s==='PARTTIME'?'ppt':'pho'}">${s==='FULLTIME'?'Fulltime':s==='PARTTIME'?'Parttime':'Horista'}</span>`}
function norm(x){return String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function unique(arr){return [...new Set(arr.filter(x=>x!==''&&x!==null&&x!==undefined))].sort((a,b)=>String(a).localeCompare(String(b),'pt-BR'))}
function optionHTML(items,chosen,label){return `<option value="">${escapeHtml(label)}</option>`+items.map(x=>`<option value="${escapeHtml(x)}" ${x===chosen?'selected':''}>${escapeHtml(x)}</option>`).join('')}
function pageHead(title,subtitle,action=''){return `<div class="pageHead"><div><div class="eyebrow">HORISTAS · CONTROLE OPERACIONAL</div><h1>${title}</h1><p class="pageSubtitle">${subtitle}</p></div>${action}</div>`}
function metric(number,label,sub,icon){return `<div class="metric"><div class="metricTop"><span class="metricLabel">${label}</span><span class="iconBubble">${ICON(icon)}</span></div><b>${number}</b><small>${sub}</small></div>`}
function sortedStores(list){return [...list].sort((a,b)=>(PRI[a.pri]??3)-(PRI[b.pri]??3)||String(a.n).localeCompare(String(b.n),'pt-BR'))}
function getMatchingStores(){const q=norm(state.search.trim()).replace(/[^a-z0-9]+/g,' ');return sortedStores(scopedStores().filter(s=>{if(state.uf&&s.uf!==state.uf)return false;if(state.priority&&s.pri!==state.priority)return false;if(state.model&&s.model!==state.model)return false;if(state.brand&&s.b!==state.brand)return false;if(state.sector&&s.sector!==state.sector)return false;if(state.onlyFavorites&&!saved.favorites[s.id])return false;if(!q)return true;const ass=promoter(s.sector);const hay=norm([s.n,s.b,s.c,s.end,s.city,s.uf,s.sector,s.model,s.pri,ass.name,ass.phone].join(' ')).replace(/[^a-z0-9]+/g,' ');return q.split(' ').filter(Boolean).every(w=>hay.includes(w))}))}
function stats(){const ss=scopedStores(),tt=scopedTeams();return {stores:ss.length,teams:tt.length,hours:ss.reduce((a,b)=>a+Number(b.hours||0),0),visits:tt.reduce((a,b)=>a+Number(b.visits||0),0),withPhone:tt.filter(t=>validPhone(promoter(t.sector).phone)).length,nearKm:tt.filter(t=>Number(t.kmMaxDay)>=65).length,nearHours:tt.filter(t=>Number(t.totalPeakH)>=42).length,modelCheck:tt.filter(t=>t.model==='FULLTIME'&&Number(t.hours)<30).length}}
function overview(){return window.haraldDashboard?.render({scenario:state.scenario,contract:state.contract,stores:scopedStores(),teams:scopedTeams(),saved})||'<div class="panel">Carregando indicadores...</div>'}
function storeCard(s){const p=promoter(s.sector),has=validPhone(p.phone),fav=!!saved.favorites[s.id],noteCount=Number(!!(saved.notes[storeNoteKey(s)]||saved.notes[s.id]))+Number(!!saved.sectorNotes[s.sector])+Number(!!saved.promoterNotes[personNoteKey(s.sector)]);return `<article class="storeCard"><div class="storeCardTop"><div class="badgeLine">${badgePri(s.pri)}${badgeModel(s.model)}</div><button class="iconBtn" style="width:29px;height:29px;border:0" title="${fav?'Remover favorito':'Adicionar favorito'}" aria-label="Favorito" data-fav="${escapeHtml(s.id)}"><svg class="icon sm" style="${fav?'fill:#f8c66b;color:#e0a936':''}"><use href="#i-star"/></svg></button></div><div><div class="storeBrand">${text(s.b)}</div><div class="storeName">${text(s.n)}</div><div class="storeLocation">${ICON('pin')} ${text(s.city)} / ${text(s.uf)}</div></div><div class="storeDivider"></div><div class="storeFacts"><span><strong>${text(s.sector)}</strong>Setor</span><span><strong>${fmt(s.hours,1)}h</strong>Atend. / semana</span><span><strong>${fmt(s.visitH,1)}h</strong>Por visita</span></div><div class="visitMini"><div class="visitMiniWeek"><b>SEMANA 1</b><span class="${parseDays(s.w1).length?'visitScheduled':'visitNone'}">${parseDays(s.w1).length?'✓ '+escapeHtml(parseDays(s.w1).join(' · ')):'— Sem visita informada'}</span></div><div class="visitMiniWeek"><b>SEMANA 2</b><span class="${parseDays(s.w2).length?'visitScheduled':'visitNone'}">${parseDays(s.w2).length?'✓ '+escapeHtml(parseDays(s.w2).join(' · ')):'— Sem visita informada'}</span></div></div><div class="storeSignals"><span class="signal ${has?'ok':'attention'}">${ICON('phone')} ${has?text(p.name||'Promotor com contato'):'Cadastrar contato'}</span>${noteCount?`<span class="signal noteSignal">${ICON('edit')} ${noteCount} ${noteCount===1?'anotação':'anotações'}</span>`:''}</div><div class="storeFoot"><button class="btn primary sm" data-open-store="${escapeHtml(s.id)}">Abrir ficha e anotações ${ICON('arrow')}</button></div></article>`}
function renderStores(){const list=getMatchingStores(),show=list.slice(0,state.pageNo*state.limit);const ss=scopedStores();return `${pageHead('Lojas da operação','Pesquise, filtre e abra a ficha para consultar todos os detalhes.',`<button class="btn" data-clear-filters>${ICON('filter')} Limpar filtros</button>`)}<div class="filters"><div class="filterLabel">${ICON('filter')} Filtros</div><select class="select" aria-label="Filtrar UF" data-filter="uf">${optionHTML(unique(ss.map(x=>x.uf)),state.uf,'Todas as UFs')}</select><select class="select" aria-label="Filtrar prioridade" data-filter="priority">${optionHTML(['Máxima','Média','Baixa'],state.priority,'Toda prioridade')}</select><select class="select" aria-label="Filtrar bandeira" data-filter="brand">${optionHTML(unique(ss.map(x=>x.b)),state.brand,'Todas as bandeiras')}</select><select class="select" aria-label="Filtrar setor" data-filter="sector">${optionHTML(unique(ss.map(x=>x.sector)),state.sector,'Todos os setores')}</select><button class="btn sm ${state.onlyFavorites?'success':''}" id="favoriteOnly">${ICON('star')} ${state.onlyFavorites?'Favoritas selecionadas':'Só favoritas'}</button><span class="count">${fmt(list.length)} de ${fmt(ss.length)} lojas</span></div>${state.search?`<div class="callout" style="margin-bottom:14px">${ICON('search')}<span>Resultado para <b>${escapeHtml(state.search)}</b>. Para remover a busca, apague o campo no topo.</span></div>`:''}${list.length?`<div class="storeGrid">${show.map(storeCard).join('')}</div>${list.length>show.length?`<div class="paginator"><button class="btn" data-more>Mostrar mais ${Math.min(state.limit,list.length-show.length)} lojas (${fmt(list.length-show.length)} restantes) ${ICON('arrow')}</button></div>`:''}`:empty('Nenhuma loja encontrada','Experimente limpar um filtro ou pesquisar outro termo.')}${footer()}`}
function empty(title,desc){return `<div class="empty"><span class="emptyIcon">${ICON('search')}</span><h3>${title}</h3><p>${desc}</p></div>`}
function hasSectorContact(t){return validPhone(promoter(t.sector).phone);}
function visibleTeams(){
 const q=norm(state.search.trim());
 return scopedTeams().filter(t=>!state.uf||t.uf===state.uf)
 .filter(t=>!state.model||t.model===state.model)
 .filter(t=>state.contact==="ALL"||(state.contact==="WITH"?hasSectorContact(t):!hasSectorContact(t)))
 .filter(t=>!q||norm([t.sector,t.cities,t.uf,t.model,t.modal,promoter(t.sector).name,promoter(t.sector).phone].join(" ")).includes(q))
 .sort((a,b)=>Number(hasSectorContact(a))-Number(hasSectorContact(b))||String(a.sector).localeCompare(String(b.sector),"pt-BR"));
}
function sectorListHeader(){
 return `<div class="sectorListHead" aria-hidden="true"><span>SETOR / MODELO</span><span>REGIÃO</span><span>PROMOTOR</span><span>CONTATO</span><span>ATENDIMENTO</span><span></span></div>`;
}
function listSummary(list,total){
 const withContact=list.filter(hasSectorContact).length;
 const withoutContact=list.length-withContact;
 return `<div class="sectorListSummary"><div><strong>${fmt(list.length)} setores encontrados</strong><span class="summaryText"> · ${fmt(total)} na seleção de contratação · Pendências de contato primeiro</span></div><div class="contactTallies"><span class="contactTally yes">✓ ${fmt(withContact)} com contato</span><span class="contactTally no">! ${fmt(withoutContact)} sem contato</span></div></div>`;
}
function teamCard(t){
 const p=promoter(t.sector),has=hasSectorContact(t),name=p.name?text(p.name):"Promotor não cadastrado";
 const isClt=t.model==="FULLTIME"||t.model==="PARTTIME";
 const modal=t.modal==="KM"?"KM":"VT";
 return `<button type="button" class="sectorListRow ${has?"":"missingContact"}" data-open-team="${escapeHtml(t.sector)}" aria-label="Abrir ficha completa do setor ${escapeHtml(t.sector)}; ${has?"com contato":"sem contato"}">
 <span class="sectorCell"><strong>${text(t.sector)}</strong><small>${isClt?"CLT · "+text(t.model):"Horista"} · ${modal}</small></span>
 <span class="sectorCity"><strong>${text(t.cities||t.uf)}</strong><small>${text(t.uf)} · ${text(t.region||"Região a confirmar")}</small></span>
 <span class="sectorPerson"><span class="sectorAvatar" aria-hidden="true">${escapeHtml(initial(p.name))}</span><span class="sectorPersonName"><strong>${name}</strong><small>${p.badge?"Matrícula "+text(p.badge):"Matrícula não informada"}</small></span></span>
 <span class="sectorContact"><span class="sectorContactBadge ${has?"":"missing"}">${has?"✓ Com contato":"! Sem contato"}</span><small>${has?text(p.phone):"Telefone ausente ou inválido"}</small></span>
 <span class="sectorLoad"><strong>${fmt(t.pdvs)} lojas</strong><small>${fmt(t.hours,1)}h / semana</small></span>
 <span class="sectorChevron" aria-hidden="true">›</span>
 </button>`;
}
function filterTeams(){
 const base=scopedTeams();
 const chosen=base.filter(t=>(!state.uf||t.uf===state.uf)&&(!state.model||t.model===state.model));
 return `<div class="filters"><div class="filterLabel">${ICON("filter")} Filtrar setores</div>
 <select class="select" data-filter="uf" aria-label="Filtrar UF">${optionHTML(unique(base.map(t=>t.uf)),state.uf,"Todas as UFs")}</select>
 
 <select class="select listFilterSelect" data-filter="contact" aria-label="Filtrar setores por contato">
 <option value="ALL" ${state.contact==="ALL"?"selected":""}>Todos os contatos</option>
 <option value="WITH" ${state.contact==="WITH"?"selected":""}>✓ Com contato</option>
 <option value="WITHOUT" ${state.contact==="WITHOUT"?"selected":""}>! Sem contato</option>
 </select><span class="count">${fmt(chosen.length)} setores no filtro básico</span></div>`;
}
function renderTeams(){
 const all=visibleTeams(),shown=all.slice(0,state.pageNo*50);
 return `${pageHead("Setores e equipes","Uma linha por setor. Selecione qualquer linha para abrir a ficha detalhada, com roteiro, promotor, anotações e WhatsApp.")}${filterTeams()}${listSummary(all,scopedTeams().length)}${sectorListHeader()}
 <div class="sectorList" aria-label="Lista de setores">${shown.map(teamCard).join("")}</div>
 ${!shown.length?empty("Nenhum setor encontrado","Experimente selecionar Todos os contatos ou remover algum filtro."):""}
 ${shown.length<all.length?`<div class="paginator"><button class="btn" data-more>Exibir mais ${fmt(Math.min(50,all.length-shown.length))} setores ${ICON("arrow")}</button></div>`:""}${footer()}`;
}
function renderPeople(){
 const all=visibleTeams(),shown=all.slice(0,state.pageNo*50);
 return `${pageHead("Promotores e contatos","Consulta por setor e promotor, em lista. Clique na linha para abrir a ficha e acessar Equipe e histórico.",
 `<div class="row wrap"><button class="btn" id="exportContacts">${ICON("download")} Exportar contatos CSV</button></div>`)}
 ${filterTeams()}${listSummary(all,scopedTeams().length)}${sectorListHeader()}
 <div class="sectorList" aria-label="Lista de promotores por setor">${shown.map(teamCard).join("")}</div>
 ${!shown.length?empty("Nenhum registro encontrado","Revise o filtro Com contato / Sem contato."):""}
 ${shown.length<all.length?`<div class="paginator"><button class="btn" data-more>Mostrar mais setores ${ICON("arrow")}</button></div>`:""}${footer()}`;
}
function footer(){return `<div class="footnote">Fonte oficial: Controle Operacional Horistas.xlsx · aba Controle Operacional · dados publicados no Supabase.</div>`}
function renderRoutes(){const all=scopedTeams(),sel=all.find(t=>t.sector===state.routeSector)||all[0];if(!sel)return `${pageHead('Roteiro semanal','Sem setores nesta seleção')}${empty('Nenhum setor selecionado','Altere o filtro de equipe acima.')}`;if(state.routeSector!==sel.sector)state.routeSector=sel.sector;const l=scopedStores().filter(x=>x.sector===sel.sector),w=state.week;const eachDay=WEEKDAYS.map(day=>({day,stores:l.filter(x=>parseDays(x['w'+w]).includes(day))}));const today=eachDay.find(x=>x.day===state.day)?.stores||[];const weekUnique=l.filter(s=>parseDays(s['w'+w]).length),activeCount=eachDay.filter(x=>x.stores.length).length;return `${pageHead('Roteiro de visitas','Escolha a semana e veja claramente os dias COM VISITA ou SEM VISITA.')}<div class="routeToolbar"><div class="row wrap"><span class="filterLabel">${ICON('layers')} Setor</span><select class="select" id="routeSector" aria-label="Escolher setor" style="min-width:210px;max-width:320px">${all.map(x=>`<option value="${escapeHtml(x.sector)}" ${x.sector===sel.sector?'selected':''}>${text(x.sector)} · ${text(x.uf)}</option>`).join('')}</select></div><div class="weekToggle"><button data-week="1" class="${w===1?'active':''}" aria-pressed="${w===1}">Semana 1</button><button data-week="2" class="${w===2?'active':''}" aria-pressed="${w===2}">Semana 2</button></div></div><div class="routeGuide"><div><span class="guideEyebrow">PROGRAMAÇÃO DO SETOR</span><strong>${text(sel.sector)}</strong><small>${text(sel.cities)} · ${fmt(l.length)} lojas no setor</small></div><div class="routeGuideKpis"><span><b>${fmt(weekUnique.length)}</b> lojas com dia informado na semana ${w}</span><span><b>${activeCount}/6</b> dias com visitas planejadas</span></div></div><div class="routeLegend"><span><i class="legendDot filled"></i> Com atendimento</span><span><i class="legendDot emptyDot"></i> Sem visita planejada</span></div><div class="dayTabs">${eachDay.map(({day,stores},i)=>`<button class="dayBtn ${stores.length?'hasVisits':'noVisits'} ${state.day===day?'active':''}" data-day="${day}" aria-pressed="${state.day===day}"><strong>${WEEKLABEL[i]}</strong><span class="dayStatus">${stores.length?'✓ COM VISITA':'— SEM VISITA'}</span><span class="dayQuantity">${stores.length?`${stores.length} ${stores.length===1?'loja':'lojas'}`:'0 lojas'}</span></button>`).join('')}</div><div class="attendancePanel ${today.length?'yes':'no'}"><span class="attendanceIcon">${today.length?'✓':'—'}</span><div><small>${WEEKLABEL[WEEKDAYS.indexOf(state.day)].toUpperCase()} · SEMANA ${w}</small><h2>${today.length?`ATENDIMENTO PROGRAMADO · ${today.length} ${today.length===1?'LOJA':'LOJAS'}`:'SEM VISITA PROGRAMADA'}</h2><p>${today.length?`${fmt(today.reduce((a,x)=>a+Number(x.visitH||0),0),1)}h estimadas de atendimento nas lojas abaixo.`:'Nenhuma loja possui visita registrada para este dia no ciclo selecionado. Confira outro dia ou outra semana.'}</p></div></div>${today.length?`<div class="routeLine">${today.map((s,i)=>`<div class="routeStop"><div class="routeNumber">${String(i+1).padStart(2,'0')}</div><div class="routeContent"><div class="routeInfo"><h3>${text(s.n)}</h3><p>${text(s.b)} · ${text(s.city)} / ${text(s.uf)} · ${text(s.end)}</p><small class="routeStoreSector">Setor ${text(s.sector)} · ${badgeModel(s.model)}</small></div><div class="routeBadges">${badgePri(s.pri)}<span class="pill soft">${fmt(s.visitH,1)}h por visita</span><button class="btn primary sm" data-open-store="${escapeHtml(s.id)}">Ficha / anotações ${ICON('chevron')}</button></div></div></div>`).join('')}</div>`:''}<p class="mini routeFootInfo">As informações são <b>planejadas</b>, não confirmação de presença. Dias extraídos de “DIAS SEMANA 1/2” da base; a lista não representa sequência otimizada de deslocamento.</p>${footer()}`}
function parseDays(value){return String(value||'').toLocaleUpperCase('pt-BR').replaceAll('Á','A').split(/[^A-Z]+/).map(x=>x==='QUAT'?'QUA':x).filter(x=>WEEKDAYS.includes(x))}
function render(){const names={overview:'Visão geral',stores:'Lojas',teams:'Setores',routes:'Roteiros',people:'Promotores'};document.getElementById('crumbName').textContent=names[state.page]||'Visão geral';const renderers={overview,stores:renderStores,teams:renderTeams,routes:renderRoutes,people:renderPeople};document.getElementById('content').innerHTML=(renderers[state.page]||overview)();const top=document.getElementById('horistaTopNumbers');if(top){const ts=scopedTeams(),filled=ts.filter(t=>Boolean(promoter(t.sector).name)).length;top.textContent=`${scopedStores().length} lojas · ${ts.length} setores · ${filled} ativos · ${ts.length-filled} vagas abertas`;}const week=document.getElementById('hdTopWeek');if(week)week.value=window.haraldDashboard?.getState?.().week||'AVG';document.getElementById('sideStoreCount').textContent=scopedStores().length;if(state.page==='overview')window.haraldDashboard?.afterRender?.();}
function showDrawer(html){document.getElementById('drawer').innerHTML=html;document.getElementById('drawer').classList.add('open');document.getElementById('backdrop').classList.add('open');document.body.style.overflow='hidden';setTimeout(()=>document.getElementById('closeDrawer')?.focus(),50)}
function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('backdrop').classList.remove('open');document.body.style.overflow='';state.drawer=null}
function getStore(id){return shops().find(s=>s.id===id)}
function teamById(id){return teams().find(t=>t.sector===id)}
function priorityAlert(s){const t=teamById(s.sector);return t&&(Number(t.kmMaxDay)>=65||Number(t.totalPeakH)>=42)}
function info(k,v,full=false){return `<div class="infoField ${full?'full':''}"><small>${k}</small><strong>${text(v)}</strong></div>`}
function formatCnpj(v){const n=String(v||'').replace(/\D/g,'').padStart(14,'0');return n.length===14?`${n.slice(0,2)}.${n.slice(2,5)}.${n.slice(5,8)}/${n.slice(8,12)}-${n.slice(12)}`:v}
function makeDays(val){const d=parseDays(val);return `<div class="days">${WEEKDAYS.map(x=>`<span class="day ${d.includes(x)?'active':'off'}" aria-label="${x} ${d.includes(x)?'com visita':'sem visita'}">${d.includes(x)?'✓ ':'— '}${x}</span>`).join('')}</div>`}
function detailIntro(label,id){return `<div class="drawerTop"><div class="crumb">${ICON('store')}<b>${label}</b><span class="pill soft">${state.scenario}</span></div><button class="iconBtn" id="closeDrawer" aria-label="Fechar ficha">${ICON('close')}</button></div>`}
function personForm(sector,withStore){
 const p=promoter(sector);
 return `<section class="drawerSection"><div class="drawerSectionTitle"><h3>${ICON('users')} Profissional deste setor</h3><span class="pill soft">Vínculo com histórico</span></div>
 <div class="teamPromoter" style="margin:10px 0 17px"><span class="avatar">${escapeHtml(initial(p.name))}</span><div><strong>${p.name?text(p.name):'Nenhum promotor cadastrado'}</strong><span>${p.phone?text(p.phone):'Telefone pendente'} · Matrícula: ${text(p.badge||'Pendente')}</span></div></div>
 <div class="callout" style="margin-bottom:12px">${ICON('layers')} <span>O setor e o roteiro são permanentes. Para substituir o profissional, use a central de equipe; o histórico anterior será preservado.</span></div>
 <button class="btn primary" type="button" id="managePeople">${ICON('users')} Abrir ficha, status e histórico</button></section>`;
}
function storeNoteKey(s){const c=String(s.c||'').replace(/\D/g,'');return c.length===14?'cnpj:'+c:'loja:'+norm([s.n,s.city,s.uf].join('|'))}
function personNoteKey(sector){const p=promoter(sector);const phone=String(p.phone||'').replace(/\D/g,'');return validPhone(phone)?'phone:'+waDigits(phone):p.name?'name:'+norm(p.name):'sector:'+sector}
function noteTile(kind,sector,store){const id=kind==='store'?'storeNote':kind==='sector'?'sectorNote':'promoterNote';const title=kind==='store'?'1. LOJA':kind==='sector'?'2. SETOR':'3. PROMOTOR';const label=kind==='store'?'Somente esta loja':kind==='sector'?'Todas as lojas deste setor':'Profissional cadastrado neste setor';const item=kind==='store'?(saved.notes[storeNoteKey(store)]||saved.notes[store.id]):kind==='sector'?saved.sectorNotes[sector]:saved.promoterNotes[personNoteKey(sector)];const help=kind==='store'?'Ex.: acesso ao PDV, problema de exposição, gerente da loja...':kind==='sector'?'Ex.: dificuldade de deslocamento, redistribuição, orientação de cobertura...':'Ex.: pendência de admissão, treinamento, retorno, orientação individual...';return `<div class="noteTile ${item?'filled':''}"><div class="noteTileHead"><span class="noteKind ${kind}">${title}</span><strong>${label}</strong>${item?'<span class="noteHas">✓ Anotação salva</span>':'<span class="noteEmpty">Sem registro</span>'}</div><textarea id="${id}" rows="3" placeholder="${help}">${escapeHtml(item||'')}</textarea><div class="noteActions"><span>${kind==='promoter'?'Vinculada ao profissional alocado no setor':kind==='sector'?'Compartilhada entre as lojas do setor':'Exclusiva deste PDV'} · sincronizada no Supabase com histórico</span><button class="btn sm ${item?'':'primary'}" data-save-note="${kind}">${ICON('check')} Salvar ${kind==='store'?'loja':kind==='sector'?'setor':'promotor'}</button></div></div>`}
function notesSection(sector,store=null){return `<section class="drawerSection notesSection" id="notes-area"><div class="drawerSectionTitle"><h3>${ICON('edit')} Anotações importantes</h3><span class="pill soft">3 tipos de registro</span></div><p class="notesGuide">Separe o que aconteceu <b>na loja</b>, o que vale <b>para todo o setor</b> e o que pertence <b>ao promotor</b>.</p><div class="noteTiles">${store?noteTile('store',sector,store):''}${noteTile('sector',sector,store)}${noteTile('promoter',sector,store)}</div></section>`}
function saveScopedNote(kind){if(!state.drawer||!['store','sector','promoter'].includes(kind))return;const sector=state.drawer.sector,id=kind==='store'?storeNoteKey(getStore(state.drawer.id)):kind==='promoter'?personNoteKey(sector):sector;if(kind==='store'&&state.drawer.type!=='store')return;const node=document.getElementById(kind==='store'?'storeNote':kind==='sector'?'sectorNote':'promoterNote');if(!node)return;const v=node.value;const target=kind==='store'?saved.notes:kind==='sector'?saved.sectorNotes:saved.promoterNotes;if(v.trim())target[id]=v;else delete target[id];let ok=persist();if(ok){node.closest('.noteTile')?.classList.toggle('filled',!!v.trim());const stateTag=node.closest('.noteTile')?.querySelector('.noteHas,.noteEmpty');if(stateTag){stateTag.textContent=v.trim()?'✓ Anotação salva':'Sem registro';stateTag.className=v.trim()?'noteHas':'noteEmpty'}}toast(ok?'Anotação de '+(kind==='store'?'loja':kind==='sector'?'setor':'promotor')+' salva':'Não foi possível salvar: exporte um backup.')}
function templates(s,person){const greeting=person.name?`Olá, ${person.name.split(' ')[0]}!`:'Olá!';const signature=`Aqui é ${saved.author||'o coordenador'}, da coordenação da conta HARALD.`;const where=s?`Loja: ${s.n} (${s.city}/${s.uf})\nSetor: ${s.sector}`:`Setor: ${state.drawer.sector}`;return {alignment:`${greeting}\n${signature}\n\nPreciso alinhar com você o atendimento referente a:\n${where}\n\nPode me confirmar, por favor, a programação?`,visit:`${greeting}\n${signature}\n\nConsegue confirmar sua visita programada?\n${where}\n\nMe informe, por favor, se está tudo certo ou se existe alguma dificuldade.`,adjust:`${greeting}\n${signature}\n\nIdentificamos um ponto que precisa de ajuste na execução:\n${where}\n\nPor favor, verifique e me retorne com a correção ou previsão.`,hello:`${greeting}\nSou ${saved.author||'o coordenador'}, coordenador da conta HARALD pela Geniale. Estou acompanhando seu setor e fico à disposição para alinharmos as atividades.\n\n${where}`}}
function whatsappSection(sector,s){const p=promoter(sector);const m=templates(s,p);return `<section class="drawerSection"><div class="drawerSectionTitle"><h3>${ICON('message')} WhatsApp rápido</h3><span class="pill mint">Mensagem pronta</span></div><div class="field"><label for="messageTemplate">Tipo de mensagem</label><select id="messageTemplate"><option value="alignment">Alinhar atendimento</option><option value="visit">Confirmar visita</option><option value="adjust">Solicitar ajuste</option><option value="hello">Apresentação</option></select></div><div class="field" style="margin-top:10px"><label for="messageText">Você pode editar antes de enviar</label><textarea id="messageText" style="min-height:140px">${escapeHtml(m.alignment)}</textarea></div><div class="drawerActions"><button class="btn primary whatsBtn" id="openWhatsapp">${ICON('whatsapp')} Abrir WhatsApp</button><button class="btn" id="copyMessage">${ICON('copy')} Copiar mensagem</button></div><p class="mini" style="margin-top:9px">O botão abre a conversa com o número cadastrado. A mensagem só é enviada quando você confirmar no WhatsApp.</p></section>`}
function contactSpotlight(sector){const p=promoter(sector),has=validPhone(p.phone);return `<div class="contactSpotlight"><div class="spotPersonIcon">${ICON('users')}</div><div class="spotContact"><small>PROMOTOR RESPONSÁVEL PELO SETOR</small><strong>${p.name?text(p.name):'Promotor ainda não informado'}</strong><span>${has?text(p.phone):'Telefone ainda não cadastrado'} · ${text(p.situation||'Situação pendente')}</span></div>${has?`<button class="btn primary sm" data-quick-whatsapp="${escapeHtml(sector)}">${ICON('whatsapp')} Mensagem WhatsApp</button>`:`<button class="btn sm" data-jump="pName">${ICON('edit')} Cadastrar contato</button>`}</div>`}
function quickWhatsapp(sector){const p=promoter(sector);if(!validPhone(p.phone)){toast('Cadastre o WhatsApp primeiro.');return}const store=state.drawer?.type==='store'?getStore(state.drawer.id):null;const msg=templates(store,p).alignment;window.open('https://wa.me/'+waDigits(p.phone)+'?text='+encodeURIComponent(msg),'_blank','noopener,noreferrer');toast('WhatsApp aberto com mensagem pronta; confirme o envio no aplicativo.')}
function storeDrawer(s){const t=teamById(s.sector)||{},favorite=!!saved.favorites[s.id];state.drawer={type:'store',id:s.id,sector:s.sector};showDrawer(`${detailIntro('Ficha completa da loja',s.id)}<div class="drawerScroll"><div class="eyebrow">LOJA / ${text(s.b)}</div><div class="drawerHeading"><div><h1>${text(s.n)}</h1><p>${ICON('pin')} ${text(s.city)} · ${text(s.uf)} · ${text(s.sector)}</p></div><button title="${favorite?'Desfavoritar':'Favoritar'}" class="iconBtn" data-fav="${escapeHtml(s.id)}"><svg class="icon" style="${favorite?'fill:#f8c66b;color:#e0a936':''}"><use href="#i-star"/></svg></button></div><div class="badgeLine" style="margin-bottom:15px">${badgePri(s.pri)}${badgeModel(s.model)}<span class="pill soft">Modal ${text(s.modal)}</span>${priorityAlert(s)?'<span class="pill warning">Verificar carga do setor</span>':''}</div>
<div class="drawerKpis"><div class="drawerKpi"><b>${fmt(s.visitH,1)}h</b><span>Por visita</span></div><div class="drawerKpi"><b>${fmt(s.hours,1)}h</b><span>Atend./sem</span></div><div class="drawerKpi"><b>${fmt(s.visits1,1)}</b><span>Visitas na sem. 1</span></div><div class="drawerKpi"><b>${fmt(t.pdvs)}</b><span>Lojas no setor</span></div></div>
${contactSpotlight(s.sector)}<section class="drawerSection sectionFeature"><div class="drawerSectionTitle"><h3>${ICON('calendar')} Dias com e sem atendimento</h3><span class="pill mint">CONFIRA AS DUAS SEMANAS</span></div><p class="scheduleExplain">✓ em destaque = <b>tem visita</b> · — cinza = <b>sem visita planejada</b></p><div class="weekColumns"><div class="weekColumn"><small>Semana 1</small>${makeDays(s.w1)}<p>${parseDays(s.w1).length?`✓ Atendimento: ${text(s.w1)}`:'Nenhuma visita informada nesta semana'}</p></div><div class="weekColumn"><small>Semana 2</small>${makeDays(s.w2)}<p>${parseDays(s.w2).length?`✓ Atendimento: ${text(s.w2)}`:'Nenhuma visita informada nesta semana'}</p></div></div><div class="drawerActions"><button class="btn sm" data-route-team="${escapeHtml(s.sector)}">${ICON('calendar')} Ver roteiro completo do setor</button></div></section>
${notesSection(s.sector,s)}
<section class="drawerSection"><div class="drawerActions"><button type="button" class="btn primary" data-hp-store="${escapeHtml(s.id)}" data-hp-scenario="${escapeHtml(s.sc)}">${ICON("calendar")} Ver linha do tempo desta loja</button></div></section>
<section class="drawerSection"><div class="drawerSectionTitle"><h3>${ICON('store')} Identificação e endereço</h3></div><div class="infoGrid">${info('CNPJ',formatCnpj(s.c))}${info('Bandeira',s.b)}${info('Município / UF',`${s.city} / ${s.uf}`)}${info('Região',s.region)}${info('Bairro',s.district)}${info('CEP',s.cep)}${info('Endereço',s.end,true)}${info('Canal',s.channel)}${info('Fase',s.phase)}${info('Origem da loja',s.rev)}${s.sourceObs?info('Observação na base',s.sourceObs,true):''}</div><div class="drawerActions"><a href="${mapHref(s)}" target="_blank" rel="noopener noreferrer" class="btn sm">${ICON('pin')} Abrir no Google Maps</a></div></section>
<section class="drawerSection"><div class="drawerSectionTitle"><h3>${ICON('layers')} Informações do setor</h3></div><div class="infoGrid">${info('Setor',s.sector)}${info('Modelo',s.model)}${info('Atendimento da equipe',`${fmt(t.hours,1)}h/sem`)}${info('Pico semanal estimado',`${fmt(t.totalPeakH,1)}h`)}${info('Pico diário de deslocamento',`${fmt(t.kmMaxDay,1)} km`)}${info('Modal',t.modal)}${info('Situação do roteiro',t.situation,true)}</div></section>
${personForm(s.sector,true)}
${whatsappSection(s.sector,s)}<p class="mini" style="padding:0 4px">Fonte: Controle Operacional Horistas.xlsx · aba Controle Operacional. Alterações operacionais devem ser feitas na fonte oficial.</p></div>`)}
function teamDrawer(t){state.drawer={type:'team',sector:t.sector};const related=shops().filter(x=>x.sector===t.sector);showDrawer(`${detailIntro('Ficha do setor',t.sector)}<div class="drawerScroll"><div class="eyebrow">SETOR / ${text(t.uf)}</div><div class="drawerHeading"><div><h1>${text(t.sector)}</h1><p>${text(t.cities)} · ${text(t.region)}</p></div>${badgeModel(t.model)}</div><div class="drawerKpis"><div class="drawerKpi"><b>${fmt(t.pdvs)}</b><span>Lojas</span></div><div class="drawerKpi"><b>${fmt(t.visits,1)}</b><span>Visitas/sem</span></div><div class="drawerKpi"><b>${fmt(t.hours,1)}h</b><span>Atend./sem</span></div><div class="drawerKpi"><b>${fmt(t.kmMaxDay,1)}</b><span>KM máx. dia</span></div></div>
<section class="drawerSection"><div class="drawerSectionTitle"><h3>${ICON('layers')} Dimensionamento do setor</h3></div><div class="infoGrid">${info('Modelo',t.model)}${info('Modal',t.modal)}${info('Cidades',t.cities,true)}${info('Reserva de deslocamento',`${fmt(t.reserve,1)}h/sem`)}${info('Capacidade total',`${fmt(t.capacity,1)}h/sem`)}${info('Pico semanal total',`${fmt(t.totalPeakH,1)}h`)}${info('KM semana 1',`${fmt(t.km1,1)} km`)}${info('KM semana 2',`${fmt(t.km2,1)} km`)}${info('KM médio semanal',`${fmt(t.kmAvg,1)} km`)}${info('Situação estimada',t.situation,true)}</div><div class="drawerActions"><button class="btn" data-route-team="${escapeHtml(t.sector)}">${ICON('calendar')} Abrir roteiro por dia</button></div></section>
${contactSpotlight(t.sector)}${notesSection(t.sector)}${personForm(t.sector)}${whatsappSection(t.sector,null)}
<section class="drawerSection"><div class="drawerSectionTitle"><h3>${ICON('store')} Lojas atendidas (${related.length})</h3></div>${related.map(s=>`<button class="shortcut" style="margin-bottom:7px;width:100%;padding:10px 12px;box-shadow:none" data-open-store="${escapeHtml(s.id)}"><span class="shIcon" style="width:31px;height:31px">${ICON('store')}</span><span style="min-width:0;text-align:left;flex:1">${text(s.n)}<small>${text(s.city)} · Sem.1: ${text(s.w1)} · Sem.2: ${text(s.w2)}</small></span>${ICON('chevron')}</button>`).join('')}</section></div>`)}
function mapHref(s){let query=(Number.isFinite(Number(s.lat))&&Number.isFinite(Number(s.lon))&&s.lat!==''&&s.lon!=='')?`${s.lat},${s.lon}`:[s.end,s.city,s.uf].filter(Boolean).join(' ');return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(query)}
function validPhone(p){let s=String(p||'').replace(/\D/g,'');if(s.startsWith('55')&&(s.length===12||s.length===13))s=s.slice(2);return s.length===10||s.length===11}
function waDigits(p){let s=String(p||'').replace(/\D/g,'');if(s.startsWith('55')&&(s.length===12||s.length===13))return s;return '55'+s}
function savePerson(quiet){if(!state.drawer)return false;const id=state.drawer.sector;const old=promoter(id);const oldKey=personNoteKey(id);const val=i=>document.getElementById(i)?.value.trim()||'';saved.promoters[id]={name:val('pName'),phone:val('pPhone'),situation:val('pSituation')||'Não informado',badge:val('pBadge'),supervisor:val('pSupervisor'),supervisorPhone:val('pSupervisorPhone')};const newKey=personNoteKey(id);if(oldKey!==newKey&&saved.promoterNotes[oldKey]&&!saved.promoterNotes[newKey]&&(!old.name||norm(old.name)===norm(saved.promoters[id].name))){saved.promoterNotes[newKey]=saved.promoterNotes[oldKey];delete saved.promoterNotes[oldKey]}let ok=persist();if(!quiet)toast(ok?'Contato salvo para todas as lojas deste setor':'Não foi possível salvar neste navegador: exporte um backup.');return ok}

function getMsg(){const t=document.getElementById('messageText');return t?.value||''}
function setMsgTemplate(){if(!state.drawer)return;const p={...promoter(state.drawer.sector),name:document.getElementById('pName')?.value?.trim()||promoter(state.drawer.sector).name};const s=state.drawer.type==='store'?getStore(state.drawer.id):null;const t=templates(s,p),type=document.getElementById('messageTemplate').value;document.getElementById('messageText').value=t[type]||t.alignment}
function sendWhatsapp(){if(!state.drawer)return;savePerson(true);const p=promoter(state.drawer.sector),phone=p.phone;if(!validPhone(phone)){toast('Cadastre um número de WhatsApp válido (DDD + telefone) antes de abrir.');document.getElementById('pPhone')?.focus();return}const url='https://wa.me/'+waDigits(phone)+'?text='+encodeURIComponent(getMsg());window.open(url,'_blank','noopener,noreferrer');toast('WhatsApp aberto com a mensagem preparada. Confirme o envio no aplicativo.')}
async function copyMessage(){const value=getMsg();if(!value){toast('Não há mensagem para copiar.');return}try{await navigator.clipboard.writeText(value);toast('Mensagem copiada.')}catch(e){const input=document.getElementById('messageText');input?.select();try{document.execCommand('copy');toast('Mensagem copiada.')}catch(err){toast('Selecione e copie o texto da mensagem.')}}}
function toggleFav(id){saved.favorites[id]=!saved.favorites[id];if(!saved.favorites[id])delete saved.favorites[id];persist();if(state.drawer?.type==='store'){const s=getStore(id);if(s)storeDrawer(s)}render();toast(saved.favorites[id]?'Loja adicionada aos favoritos':'Loja removida dos favoritos')}
function download(name,body,type){const b=new Blob([body],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
function exportBackup(){const payload={format:'HARALD-SISTEMATICA-VISUAL',version:1,exportedAt:new Date().toISOString(),promoters:saved.promoters,notes:saved.notes,sectorNotes:saved.sectorNotes,promoterNotes:saved.promoterNotes,favorites:saved.favorites,author:saved.author};download('HARALD_backup_contatos_anotacoes.json',JSON.stringify(payload,null,2),'application/json;charset=utf-8');toast('Backup JSON exportado.')}
function exportContacts(){const rows=[['CENARIO','SETOR','UF','CIDADES','MODELO','MODAL','PROMOTOR','WHATSAPP','SITUACAO','MATRICULA','SUPERVISOR','TELEFONE_SUPERVISOR']];for(const t of teams()){const p=promoter(t.sector);rows.push([state.scenario,t.sector,t.uf,t.cities,t.model,t.modal,p.name||'',p.phone||'',p.situation||'',p.badge||'',p.supervisor||'',p.supervisorPhone||''])}const csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');download(`HARALD_promotores_${state.scenario}.csv`,csv,'text/csv;charset=utf-8');toast('Planilha de contatos CSV exportada.')}
async function restoreBackup(file){if(!file)return;try{const x=JSON.parse(await file.text());if(x.format!=='HARALD-SISTEMATICA-VISUAL'||!x.promoters||typeof x.promoters!=='object')throw Error('Formato incorreto');if(!confirm('Importar o backup? Isso substituirá os contatos e anotações salvos neste navegador.'))return;saved={promoters:x.promoters,notes:x.notes||{},sectorNotes:x.sectorNotes||{},promoterNotes:x.promoterNotes||{},favorites:x.favorites||{},author:x.author||'Wagner'};persist();render();toast('Backup importado com sucesso.')}catch(e){toast('Arquivo não reconhecido. Utilize um backup exportado por este painel.')}document.getElementById('restoreInput').value=''}
function cleanFilters(){state.uf='';state.priority='';state.model='';state.brand='';state.sector='';state.search='';state.contact='ALL';state.onlyFavorites=false;state.pageNo=1;document.getElementById('globalSearch').value='';render();toast('Filtros removidos')}
// Delegação central: mantém comportamento consistente em todos os cards e telas.
document.addEventListener('click',e=>{const el=e.target.closest('button,a');if(!el)return;
 if(window.haraldDashboard?.handleAction(el))return;
 if(el.id==='managePeople'){if(window.haraldPeople)window.haraldPeople.openSector(state.drawer?.sector||'',state.scenario);return}
 if(el.dataset.quickWhatsapp){quickWhatsapp(el.dataset.quickWhatsapp);return}if(el.dataset.jump){document.getElementById(el.dataset.jump)?.scrollIntoView({behavior:'smooth',block:'center'});document.getElementById(el.dataset.jump)?.focus();return}if(el.dataset.contract){setContract(el.dataset.contract);return}if(el.dataset.saveNote){saveScopedNote(el.dataset.saveNote);return}if(el.dataset.nav){setPage(el.dataset.nav);return}if(el.dataset.go){setPage(el.dataset.go);return}if(el.dataset.scenario){setScenario(el.dataset.scenario);return}
 if(el.dataset.openStore){const s=getStore(el.dataset.openStore);if(s)storeDrawer(s);return}if(el.dataset.openTeam){const t=teamById(el.dataset.openTeam);if(t)teamDrawer(t);return}
 if(el.dataset.routeTeam){state.routeSector=el.dataset.routeTeam;state.week=1;state.day='SEG';closeDrawer();setPage('routes');return}
 if(el.dataset.fav){toggleFav(el.dataset.fav);return}if(el.dataset.more!==undefined){state.pageNo++;render();return}if(el.hasAttribute('data-clear-filters')){cleanFilters();return}if(el.id==='favoriteOnly'){state.onlyFavorites=!state.onlyFavorites;state.pageNo=1;render();return}
 if(el.dataset.week){state.week=Number(el.dataset.week);render();return}if(el.dataset.day){state.day=el.dataset.day;render();return}
 if(el.id==='mobileMenu'){document.getElementById('sidebar').classList.toggle('mobileOpen');return}if(['focusTop','focusSide'].includes(el.id)){toggleFocus();return}
 if(el.id==='exportBackup'){exportBackup();return}if(el.id==='exportContacts'){exportContacts();return}if(el.id==='importBackup'){document.getElementById('restoreInput').click();return}
 if(el.id==='closeDrawer'){closeDrawer();return}if(el.id==='saveContact'){savePerson(false);render();return}
 if(el.id==='openWhatsapp'){sendWhatsapp();render();return}if(el.id==='copyMessage'){copyMessage();return}
 });
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.filter){state[el.dataset.filter]=el.value;state.pageNo=1;render();return}if(el.id==='hdTopWeek'){window.haraldDashboard?.setWeek?.(el.value);return}if(el.id==='routeSector'){state.routeSector=el.value;state.day='SEG';render();return}if(el.id==='messageTemplate'){setMsgTemplate();return}if(el.id==='restoreInput'){restoreBackup(el.files[0]);return}});
document.getElementById('globalSearch').addEventListener('input',e=>{state.search=e.target.value;state.pageNo=1;if(state.page==='overview')setPage('stores');else render()});
document.getElementById('backdrop').addEventListener('click',closeDrawer);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.drawer)closeDrawer();else document.getElementById('sidebar').classList.remove('mobileOpen')}if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();document.getElementById('globalSearch').focus()}});

const deepCopy=x=>JSON.parse(JSON.stringify(x));
window.haraldApp={
  refresh:()=>render(),
  openStore:id=>{const store=getStore(id);if(store)storeDrawer(store);},
  getSnapshot:()=>deepCopy(saved),
  setSaved:next=>{saved=deepCopy(next);persist();render();},
  mount:payload=>{
    if(!Array.isArray(payload.stores)||!Array.isArray(payload.teams))throw Error("Formato de dados inesperado.");
    DATA.stores=payload.stores;
    DATA.teams=payload.teams;
    saved={promoters:payload.saved.promoters||{},notes:payload.saved.notes||{},sectorNotes:payload.saved.sectorNotes||{},promoterNotes:payload.saved.promoterNotes||{},favorites:payload.saved.favorites||{},author:payload.saved.author||"GENIALE"};
    state.routeSector=teams().some(t=>t.sector===state.routeSector)?state.routeSector:(teams()[0]?.sector||"");
    document.getElementById('sideStoreCount').textContent=shops().length;
    render();
  }
};
window.haraldCloud.start();
})();
</script></body></html>
